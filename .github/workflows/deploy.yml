name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without a commit (useful for scheduled posts).
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — but queue them rather than cancelling.
#
# `cancel-in-progress: true` is right for a build and wrong for a Pages deploy.
# Once actions/deploy-pages has handed a deployment to the Pages service, that
# deployment is the service's to finish; killing the job that was waiting on it
# does not cancel it. The next run then arrives behind a deployment nobody is
# watching, sits in `deployment_queued`, and times out. Queueing costs a few
# minutes on a busy day and never wedges.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Picks up testimonials approved in the Firebase console since the last
      # deploy. Non-fatal: a Firestore hiccup must not block a release, and the
      # committed cache is used instead.
      - name: Refresh approved testimonials
        run: npm run sync:testimonials
        continue-on-error: true

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's own wait loop, not ours. It defaults to 10 minutes and
          # aborts with "Timeout reached, aborting!" when the Pages service is
          # backed up — which is a queue, not a failure. Half an hour is long
          # enough to ride out a backlog and still short enough that a genuinely
          # stuck deployment surfaces the same day.
          timeout: 1800000
          # Transient 5xx from the deployment status API, tolerated before the
          # step gives up. The default of 10 is thin for a 30-minute wait.
          error_count: 20

  # Tell readers who installed the app that a new article is live.
  #
  # Runs only after `deploy`, never in parallel with it: the notification links
  # straight to the article, so the page has to exist before anyone taps it.
  # The script only queues into Firestore — the every-5-minutes send-push
  # workflow holds the VAPID key and does the delivering.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Announcing is not part of shipping. A Firestore hiccup, or the batch cap
      # refusing an unexpected pile of posts, must never mark a good deploy red.
      - name: Queue notifications for new articles
        continue-on-error: true
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/announce-new-posts.mjs
