name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without a commit (useful for scheduled posts).
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue the newest and let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Picks up testimonials approved in the Firebase console since the last
      # deploy. Non-fatal: a Firestore hiccup must not block a release, and the
      # committed cache is used instead.
      - name: Refresh approved testimonials
        run: npm run sync:testimonials
        continue-on-error: true

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
